<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/png" href="assets/field-guide-icon.png"><title>Learning Design Showcase | Field Guide Learning</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap"><style>
:root{--ink:#252C2E;--green:#34515A;--paper:#F6F3EF;--line:#C9D6DA}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:white;font:18px/1.4 Archivo,Arial,Helvetica,sans-serif}a{color:inherit}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:25px max(5vw,24px);border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:19px;letter-spacing:.08em;line-height:1.1;text-decoration:none}.back{font-size:14px;text-underline-offset:4px}.hero{background:var(--paper);padding:65px max(5vw,24px) 60px}.wrap{max-width:1180px;margin:auto}.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(34px,5vw,48px);line-height:1.02;letter-spacing:0;margin:14px 0 20px;max-width:850px;font-weight:500;color:var(--green)}.hero p{max-width:680px;margin:0;font-size:20px}main{padding:36px max(5vw,24px) 76px}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 30px}button{font:inherit;font-size:14px;border:1px solid #62828D;background:white;color:var(--green);padding:10px 18px;border-radius:0;cursor:pointer}button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 30px}.card{display:flex;flex-direction:column;min-width:0;border-bottom:1px solid var(--line);padding-bottom:24px}.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#C9D6DA;overflow:hidden;text-decoration:none}.thumb img{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover!important;object-position:center top}.thumb .placeholder{position:absolute;inset:0;display:grid;place-items:center}.placeholder{font-size:15px;color:#34515A;text-align:center;padding:20px}.card .kicker{margin:20px 0 6px}h2{font-size:24px;line-height:1.2;font-weight:500;color:var(--green);letter-spacing:0;margin:0 0 9px}.card p{margin:0 0 18px;flex:1}.launch{font-weight:700;color:var(--green);text-underline-offset:4px;align-self:flex-start}.launch:hover{text-decoration-thickness:2px}footer{background:var(--green);color:white;padding:30px max(5vw,24px);font-size:14px}footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}:focus-visible{outline:3px solid #34515A;outline-offset:4px}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;padding:12px;background:white;z-index:9}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:650px){.grid{grid-template-columns:1fr;gap:30px}.hero{padding-top:40px;padding-bottom:40px}.hero p{font-size:18px}header{padding-top:18px;padding-bottom:18px}.brand{font-size:15px}.back{font-size:12px}}
.hero{border-bottom:4px solid #C06239}.brand{color:var(--green);font-weight:600;font-size:16px}.kicker{font-size:14px;font-weight:400;letter-spacing:.04em}.launch{display:inline-block;background:var(--green);color:white;padding:12px 18px;text-decoration:none;font-size:18px}.secondary{color:var(--green);margin-top:12px;align-self:flex-start;text-underline-offset:4px}header,main{background:#FFFDF6}button{font-size:16px;font-weight:600}footer a{color:white}.brand{display:inline-flex;align-items:center;gap:10px}.brand img{width:36px;height:36px;object-fit:contain;flex:none}@media(max-width:650px){.brand img{width:30px;height:30px}.brand{gap:6px}}</style></head><body><a class="skip" href="#main">Skip to demos</a><header><a class="brand" href="https://www.fieldguidelearning.ca/"><img src="assets/field-guide-icon.png" alt="" width="36" height="36">FIELD GUIDE LEARNING</a><a class="back" href="https://www.fieldguidelearning.ca/">Visit our website ↗</a></header><section class="hero"><div class="wrap"><h1>See what we can create.</h1><p>Explore interactive demos, design prototypes and educational resources that illustrate our approach to learning design and media production.</p></div></section><main id="main" tabindex="-1"><div class="wrap"><div class="filters" role="group" aria-label="Filter demos"></div><p class="sr" role="status" id="status"></p><div class="grid" id="gallery"></div><noscript>Enable JavaScript to browse the demo library.</noscript></div></main><footer><div class="wrap"><strong>FIELD GUIDE LEARNING</strong><a href="https://www.fieldguidelearning.ca/">fieldguidelearning.ca</a></div></footer><script src="data.js"></script><script>
const demos=window.DEMOS||[], filters=document.querySelector('.filters'), gallery=document.querySelector('#gallery');const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n};const cats=['All demos',...new Set(demos.map(d=>d.category))];function link(d,cls,text){const a=el('a',cls,text);a.href=d.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',`${text}: ${d.title} (opens in a new tab)`);return a}function render(cat){for(const b of filters.children)b.setAttribute('aria-pressed',String(b.textContent===cat));const visible=demos.filter(d=>cat===cats[0]||d.category===cat);gallery.replaceChildren();for(const d of visible){const card=el('article','card');const thumb=el('div','thumb');if(d.thumbnail){const img=el('img');img.src=d.thumbnail;img.alt=d.thumbnailAlt||'';img.style.objectPosition=d.thumbnailPosition||'center top';img.addEventListener('error',()=>thumb.replaceChildren(el('span','placeholder','Screenshot pending')));thumb.append(img)}else{thumb.append(el('span','placeholder','Screenshot pending'))}card.append(thumb,el('div','kicker',d.category),el('h2','',d.title),el('p','',d.description),link(d,'launch',d.launchLabel||'Explore demo ↗'));if(d.secondaryUrl)card.append(link({...d,url:d.secondaryUrl},'secondary',d.secondaryLabel));gallery.append(card)}document.querySelector('#status').textContent=`${visible.length} demos shown`;}for(const cat of cats){const b=el('button','',cat);b.type='button';b.addEventListener('click',()=>render(cat));filters.append(b)}render(cats[0]);
</script></body></html>
